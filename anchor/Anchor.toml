[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
chainstock = "3ubCASxd8ci746bJRNkdLZQvAzyS8kngFQ6smE3XohV5"

[programs.devnet]
# One-off devnet deploy to validate the program on a real network before
# ever touching mainnet — see TODO.md section 1. Same program keypair as
# localnet/mainnet by convention.
chainstock = "3ubCASxd8ci746bJRNkdLZQvAzyS8kngFQ6smE3XohV5"

[programs.mainnet]
# Same address as localnet — Anchor keeps one program keypair per program
# across clusters by convention. The actual keypair lives at
# target/deploy/chainstock-keypair.json (gitignored, generated by the
# first `anchor build`) — back it up securely before deploying; losing it
# means losing the ability to upgrade this exact program ID.
chainstock = "3ubCASxd8ci746bJRNkdLZQvAzyS8kngFQ6smE3XohV5"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "echo 'Anchor 1.0+ default: anchor test spawns a Surfpool surfnet automatically. See ../docs/Architecture.md and tests/ in this workspace.'"
